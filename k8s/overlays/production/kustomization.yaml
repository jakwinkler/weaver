apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weaver
resources:
  - ../../base
  - api-hpa.yaml
  - web-hpa.yaml
patches:
  - path: api-patch.yaml
  - path: web-patch.yaml
  - path: ingress-patch.yaml
patchesStrategicMerge:
  - delete-postgres.yaml
  - delete-redis.yaml
configMapGenerator:
  - name: weaver-config
    literals:
      - DATABASE_HOST=weaver-db.example.com
      - DATABASE_PORT=5432
      - DATABASE_NAME=weaver
      - DATABASE_USER=weaver
      - REDIS_HOST=weaver-redis.example.com
      - REDIS_PORT=6379
      - TRUST_PROXY=uniquelocal
      - NODE_ENV=production
      - STORAGE_LOCAL_PATH=/tmp/weaver-uploads
      - WEAVER_TRUSTED_PLUGINS=
# Provision the weaver-secrets Secret out of band before applying this overlay.
# It must contain DATABASE_PASSWORD, REDIS_PASSWORD plus distinct, strong JWT_SECRET and
# JWT_REFRESH_SECRET values.
generatorOptions:
  disableNameSuffixHash: true
