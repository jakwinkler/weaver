apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weaver
resources:
  - ../../base
patches:
  - path: api-patch.yaml
  - path: web-patch.yaml
configMapGenerator:
  - name: weaver-config
    literals:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=weaver
      - DATABASE_USER=weaver
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-change-me
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-me
      - NODE_ENV=development
      - STORAGE_LOCAL_PATH=/tmp/weaver-uploads
      - WEAVER_TRUSTED_PLUGINS=
secretGenerator:
  - name: weaver-secrets
    literals:
      - DATABASE_PASSWORD=weaver_dev
generatorOptions:
  disableNameSuffixHash: true
