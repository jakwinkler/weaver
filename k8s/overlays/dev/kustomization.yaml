apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: api-patch.yaml
  - path: web-patch.yaml
configMapGenerator:
  - name: weaver-config
    literals:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=weaver
      - DATABASE_USER=weaver
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-change-me
      - NODE_ENV=development
secretGenerator:
  - name: weaver-secrets
    literals:
      - DATABASE_PASSWORD=weaver_dev
