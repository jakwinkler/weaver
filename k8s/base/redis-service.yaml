apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weaver
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: redis
