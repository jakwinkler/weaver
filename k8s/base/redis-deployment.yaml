apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weaver
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", 'exec redis-server --requirepass "$REDISCLI_AUTH"']
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: weaver-secrets
                  key: REDIS_PASSWORD
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
