apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weaver.fullname" . }}-worker
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
    {{- include "weaver.worker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "weaver.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weaver.worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "weaver.fullname" . }}-config
            - secretRef:
                name: {{ include "weaver.fullname" . }}-secrets
          volumeMounts:
            - name: uploads
              mountPath: /tmp/weaver-uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ required "storage.existingClaim must name a shared RWX PVC" .Values.storage.existingClaim | quote }}
