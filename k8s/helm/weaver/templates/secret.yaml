apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weaver.fullname" . }}-secrets
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_PASSWORD: {{ required "postgresql.auth.password must be set to a strong random value" .Values.postgresql.auth.password | b64enc | quote }}
  JWT_SECRET: {{ required "env.JWT_SECRET must be set to a strong random value" .Values.env.JWT_SECRET | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ required "env.JWT_REFRESH_SECRET must be set to a distinct strong random value" .Values.env.JWT_REFRESH_SECRET | b64enc | quote }}
