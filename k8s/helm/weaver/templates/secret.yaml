apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weaver.fullname" . }}-secrets
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
type: Opaque
data:
  IMPORT_CREDENTIAL_KEY: {{ .Values.env.IMPORT_CREDENTIAL_KEY | b64enc | quote }}
  REDIS_PASSWORD: {{ required "redis.password is required" .Values.redis.password | b64enc | quote }}
  DATABASE_PASSWORD: {{ required "postgresql.auth.password must be set to a strong random value" .Values.postgresql.auth.password | b64enc | quote }}
  JWT_SECRET: {{ required "env.JWT_SECRET must be set to a strong random value" .Values.env.JWT_SECRET | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ required "env.JWT_REFRESH_SECRET must be set to a distinct strong random value" .Values.env.JWT_REFRESH_SECRET | b64enc | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.env.GOOGLE_CLIENT_ID | b64enc | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.env.GOOGLE_CLIENT_SECRET | b64enc | quote }}
  GITHUB_CLIENT_ID: {{ .Values.env.GITHUB_CLIENT_ID | b64enc | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.env.GITHUB_CLIENT_SECRET | b64enc | quote }}
