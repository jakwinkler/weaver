apiVersion: v1
kind: Service
metadata:
  name: {{ include "weaver.fullname" . }}-web
  labels:
    {{- include "weaver.labels" . | nindent 4 }}
    {{- include "weaver.web.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "weaver.web.selectorLabels" . | nindent 4 }}
