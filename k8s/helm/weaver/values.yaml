replicaCount:
  api: 2
  web: 2
  worker: 1

image:
  api:
    repository: weaver-api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: weaver-web
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: weaver-worker
    tag: latest
    pullPolicy: IfNotPresent

service:
  api:
    port: 3000
  web:
    port: 80

ingress:
  enabled: true
  className: nginx
  host: weaver.example.com
  tls: true

postgresql:
  enabled: false
  external:
    host: ""
  auth:
    database: weaver
    username: weaver
    password: ""
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: false
  external:
    host: ""
  password: ""

storage:
  existingClaim: "" # A ReadWriteMany PVC shared by API and worker

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

env:
  IMPORT_CREDENTIAL_KEY: ""
  ALLOW_TENANT_SCHEMA_BOOTSTRAP: "false"
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
  WEAVER_TRUSTED_PLUGINS: ""
  NODE_ENV: production
  API_PUBLIC_URL: https://weaver.example.com
  WEB_URL: https://weaver.example.com
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  GITHUB_CLIENT_ID: ''
  GITHUB_CLIENT_SECRET: ''
