<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Proposed inline help on the issue form, Comments, and an empty project list</title>
  <desc id="desc">An illustration showing a visible description prompt on Create Issue, a brief mention hint under Comments, a tooltip only for optional Story Points, and an access-specific message when there are no projects.</desc>
  <rect width="960" height="520" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="37" font-size="21" font-weight="700" fill="#0f172a">Proposed help placement</text>
    <text x="24" y="60" font-size="14" fill="#475569">Concept illustration, not the current screen</text>

    <rect x="24" y="82" width="440" height="326" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="44" y="118" font-size="22" font-weight="700" fill="#0f172a">Create Issue</text>
    <text x="44" y="149" font-size="15" font-weight="700" fill="#334155">Summary</text>
    <rect x="44" y="158" width="400" height="39" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="56" y="183" font-size="15" fill="#64748b">A short title for your request</text>
    <text x="44" y="226" font-size="15" font-weight="700" fill="#334155">Description</text>
    <rect x="44" y="235" width="400" height="76" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="56" y="260" font-size="15" fill="#64748b">Add the details your team needs...</text>
    <text x="44" y="333" font-size="14" fill="#475569">What happened, and what would you like us to do?</text>
    <text x="44" y="370" font-size="14" fill="#334155">Story Points (optional)</text>
    <circle cx="212" cy="365" r="9" fill="#eef2ff" stroke="#6366f1"/>
    <text x="212" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">i</text>
    <text x="44" y="397" font-size="14" fill="#4338ca" text-decoration="underline">How to create and discuss issues</text>

    <rect x="496" y="82" width="440" height="326" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="516" y="118" font-size="22" font-weight="700" fill="#0f172a">Comments</text>
    <rect x="516" y="141" width="400" height="122" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="528" y="169" font-size="15" fill="#64748b">Add a comment...</text>
    <text x="516" y="290" font-size="14" fill="#475569">Need someone's attention? Type @ and choose their name.</text>
    <rect x="800" y="319" width="116" height="42" rx="6" fill="#4f46e5"/>
    <text x="858" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Comment</text>

    <rect x="24" y="426" width="912" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="44" y="452" font-size="14" font-weight="700" fill="#3730a3">When Projects is empty</text>
    <text x="44" y="478" font-size="17" fill="#0f172a">No projects are available yet. Ask your team to add you to a project.</text>
  </g>
</svg>
