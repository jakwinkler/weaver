# Use the original URI: SPA fallback rewrites $uri to /index.html.
map $request_uri $weaver_frame_options {
    default "DENY";
    ~^/public/[^/]+/forms/[^/?]+/?(?:\?|$) "";
}
map $weaver_frame_options $weaver_csp {
    default "frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
    "" "object-src 'none'; base-uri 'self'";
}
map "$scheme:$http_x_forwarded_proto" $weaver_hsts {
    default "";
    ~^(https:|http:https$) "max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 10 MiB attachment plus multipart overhead; API JSON/file limits remain independent.
    client_max_body_size 11m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $weaver_frame_options always;
    add_header Content-Security-Policy $weaver_csp always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $weaver_hsts always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # API proxy
    location ^~ /api/ {
        proxy_pass http://${WEAVER_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io proxy
    location /socket.io/ {
        proxy_pass http://${WEAVER_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # expires also emits Cache-Control and preserves inherited security headers.
    }
}
