name: Secret scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan Git history
        run: >-
          gitleaks git --log-opts="--all" --config .gitleaks.toml
          --redact=100 --ignore-gitleaks-allow --max-decode-depth=3 --max-archive-depth=3
      - name: Scan current tracked files
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "$RUNNER_TEMP/weaver-scan.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -x -C "$scan_dir"
          gitleaks dir "$scan_dir" --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --max-decode-depth=3 --max-archive-depth=3
