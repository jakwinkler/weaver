# Include inside the existing HTTPS server block at the outer reverse proxy.
# Keep certificate paths, server_name, and upstream routing in that site's config.
client_max_body_size 11m;
add_header Strict-Transport-Security "max-age=31536000" always;
# The upstream web container supplies CSP, framing, and content-type headers.
# Forward the original HTTPS scheme: proxy_set_header X-Forwarded-Proto $scheme;
